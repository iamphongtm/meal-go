# This fragment needs restaurant-db and kafka from the other compose files.
# Start it through the root compose file: docker compose up -d kafka-connect
services:
  kafka-connect:
    image: quay.io/debezium/connect:3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-28083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: mealgo-connect
      # Connector configuration, offsets and status persist in Kafka topics.
      CONFIG_STORAGE_TOPIC: mealgo-connect-configs
      OFFSET_STORAGE_TOPIC: mealgo-connect-offsets
      STATUS_STORAGE_TOPIC: mealgo-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      restaurant-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

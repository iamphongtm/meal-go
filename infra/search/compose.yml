services:
  search-service:
    build:
      context: ../..
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE_PATH: search-service
    restart: unless-stopped
    init: true
    env_file:
      - path: ../../search-service/.env
        required: false
    environment:
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:${SEARCH_SERVICE_PORT:-8090}:8090"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/search/restaurants/nearby); [ \"$$code\" = 400 ]"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Local development only: authentication and TLS are disabled.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-29200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-25601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch-data:

jwt:
  jwts:
    uri: http://localhost:30171/.well-known/jwks.json

spring:
  application:
    name: restaurant-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/mealgo_restaurant
    username: postgres
    password: PhongTM@2002
    driver-class-name: org.postgresql.Driver
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${jwt.jwts.uri}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  packages-to-scan: com.mealgo.restaurant_service.controller

app:
  api:
    version: ${API_VERSION:1.0.0}

server:
  port: 30172

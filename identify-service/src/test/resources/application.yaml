spring:
  application:
    name: identify-service
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    issuer: http://localhost:8082
    audience: mealgo-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    private-key: 
    public-key: 

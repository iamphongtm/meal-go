app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identify-service
              uri: http://localhost:30171
              predicates:
                - Path=${app.api-prefix}/auth/**
              filters:
                - StripPrefix=2
            - id: restaurant-service
              uri: http://localhost:30172
              predicates:
                - Path=${app.api-prefix}/restaurants/**
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem

server:
  port: 30170